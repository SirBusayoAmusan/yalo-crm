<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YALO Card — QR Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Plus Jakarta Sans',sans-serif;background:#f0f7e6;color:#1a1a2e;display:flex;flex-direction:column;align-items:center;padding:40px 16px;gap:16px}
h1{font-size:18px}
.fi{border:1.5px solid #d4e8b0;border-radius:10px;padding:11px 12px;font-family:inherit;font-size:14px;width:320px;max-width:90vw}
#qr{background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 12px rgba(124,187,66,.12)}
.btn{background:#7cbb42;color:#0e1a06;border:none;border-radius:10px;padding:11px 20px;font-weight:800;font-family:inherit;cursor:pointer}
p{font-size:12px;color:#6b7a5e;max-width:320px;text-align:center}
</style>
</head>
<body>
<h1>Generate your card's QR code</h1>
<p>Paste the published URL of your card.html page (e.g. after deploying, something like https://yalo-crm.web.app/card.html), then download the QR to print.</p>
<input class="fi" id="url" placeholder="https://yalo-crm.web.app/card.html" value="https://yalo-crm.web.app/card.html">
<button class="btn" onclick="render()">Generate</button>
<div id="qr"></div>
<button class="btn" onclick="download()">⬇️ Download PNG</button>

<script>
let qr;
function render(){
  document.getElementById('qr').innerHTML = '';
  qr = new QRCode(document.getElementById('qr'), {
    text: document.getElementById('url').value.trim(),
    width: 320, height: 320,
    colorDark: '#1a1a2e', colorLight: '#ffffff'
  });
}
function download(){
  const img = document.querySelector('#qr img') || document.querySelector('#qr canvas');
  const a = document.createElement('a');
  a.download = 'yalo-card-qr.png';
  a.href = img.tagName === 'CANVAS' ? img.toDataURL('image/png') : img.src;
  a.click();
}
render();
</script>
</body>
</html>
